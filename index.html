<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenSpend - Offline Expense Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090D16;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #0F172A;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { color: #10B981; margin-bottom: 10px; }
    p { color: #94A3B8; line-height: 1.6; }
    a { color: #10B981; text-decoration: none; font-weight: bold; }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: #10B981;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">100% OFFLINE & PRIVATE</div>
    <h1>ZenSpend</h1>
    <p>Smart, private, and effortless offline expense tracking & daily budget management for Android.</p>
    <p><a href="app-ads.txt">View app-ads.txt</a></p>
  </div>
</body>
</html>
